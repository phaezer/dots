"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = true

format = """
$username\
$hostname\
$kubernetes\
$directory\
$git_branch\
${custom.giturl}\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$direnv\
$nix_shell\
$conda\
$python\
$nodejs\
$golang\
$zig\
$rust\
$c\
$java\
$docker_context\
$aws\
$cmd_duration\
\n$os$character"""

[os]
disabled = false

# Duration entry
[cmd_duration]
min_time = 10000
format = "[󰔟 $duration](cyan)"

# Git entry
[git_metrics]
added_style = "green"
deleted_style = "red"
format = '(\([+$added]($added_style)/[-$deleted]($deleted_style)\))'

[git_status]
ahead = '[ $count](bold green) '
conflicted = '[󱡂 ](bold red) '
untracked = '[ $count](bold purple) '
staged = '[ $count](bold green) '
stashed = '[ $count](cyan) '
deleted = '[ $count](bold red) '
modified = '[ $count](bold yellow) '
behind = '[ $count](bold yellow) '
renamed = '[󰬴 $count](bold blue) '
up_to_date = '[](bold green) '
diverged = '[ $ahead_count  $behind_count ](bold red) '
format = '([$all_status$ahead_behind]($style))'

[git_branch]
symbol = " "

# Directory entry
[directory]
read_only = " 󰌾 "
# home_symbol = " "
truncation_length = 3
truncation_symbol = "…/"

# Custom entries
[custom.neovim]
command = 'bob ls | rg Used | awk "{print \$2}"' # shows output of command
detect_folders = ["lua"]
style = "green"
format = "[ $output ]($style)"
shell = ["bash"]

[custom.giturl]
# disabled = true
description = "Display symbol for remote Git server"
command = "check-git-remote"
when = 'git rev-parse --is-inside-work-tree 2> /dev/null'
shell = ["bash", "--noprofile", "--norc"]
format = "at $output  "

# Nerd fonts preset
[aws]
symbol = "  "

[buf]
symbol = " "

[c]
symbol = " "

[conda]
symbol = " "

[crystal]
symbol = " "
format = '[$symbol($version)]($style)'

[dart]
symbol = " "
format = '[$symbol($version)]($style)'

[direnv]
symbol = " "
denied_msg = " "
loaded_msg = " "
disabled = false
format = '[$symbol$loaded]($style) '

[docker_context]
symbol = " "
format = '[$symbol($version)]($style) '

[elixir]
symbol = " "
format = '[$symbol($version)]($style) '

[elm]
symbol = " "

[fennel]
symbol = " "

[golang]
symbol = " "
format = '[$symbol($version)]($style) '

[python]
symbol = " "
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style) '

[guix_shell]
symbol = " "
format = '[$symbol($version)]($style) '

[haskell]
symbol = " "

[haxe]
symbol = " "

[hostname]
ssh_symbol = " "

[java]
symbol = " "

[julia]
symbol = " "

[kotlin]
symbol = " "

[lua]
symbol = " "

[memory_usage]
symbol = "󰍛 "

[meson]
symbol = "󰔷 "

[mise]
symbol = "mise "
format = '[$symbol$health]($style) '
healthy_symbol = " "
unhealthy_symbol = " "
disabled = false

[nim]
symbol = "󰆥 "

[nix_shell]
symbol = " "
format = '[$symbol$state( \($name\))]($style) '
impure_msg = " "
pure_msg = " "

[nodejs]
symbol = " "
format = "[$symbol($version )]($style) "

[ocaml]
symbol = " "

